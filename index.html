<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIASHOP · Editor de Artes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700;1,900&display=swap">
<style>
:root{--bg:#f5f4f8;--card:#fff;--ink:#17151d;--mut:#6d6a78;--line:#e6e3ec;--pri:#EC2A8F;--pri-d:color-mix(in srgb,var(--pri) 80%,#000);--pri-l:color-mix(in srgb,var(--pri) 10%,#fff);--cy:#00AEEF;--li:#D4E957;--rd:#D3395C;--pu:#A6538C;--ok:#1f9d55;--err:#dc2626;--r:14px;--sh:0 1px 2px rgba(20,10,40,.05),0 6px 20px rgba(20,10,40,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,-apple-system,Segoe UI,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:10px;font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#f8f7fb;border-color:#d6d1df}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-d)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:#f1eff5}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--err)}
.btn.on{background:var(--pri-l);border-color:var(--pri);color:var(--pri-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-height:36px}
.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
textarea.inp{resize:vertical}
label.f{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.hint{font-size:12px;color:var(--mut);line-height:1.45;margin:6px 0 0}
.stripe{height:5px;background:linear-gradient(90deg,var(--cy),var(--pri),var(--li),var(--rd),var(--pu))}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:#f1eff5;font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap}
.chip.ok{background:#e3f6ea;color:var(--ok)}.chip.warn{background:#fdf1dc;color:#a15c07}.chip.pri{background:var(--pri-l);color:var(--pri-d)}.chip.cy{background:#e0f5fd;color:#0477a3}
.checker{background-color:#fff;background-image:conic-gradient(#ebe8f0 25%,transparent 0 50%,#ebe8f0 0 75%,transparent 0);background-size:18px 18px}
.muted{color:var(--mut)}
.empty{padding:40px 20px;text-align:center;color:var(--mut);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
/* LOGIN */
#login{min-height:100vh;display:none;place-items:center;padding:16px;background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--cy) 18%,transparent),transparent),radial-gradient(900px 600px at 110% 110%,color-mix(in srgb,var(--pri) 18%,transparent),transparent),var(--bg)}
.login-card{width:100%;max-width:410px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(30,10,50,.12);overflow:hidden}
.login-card .in{padding:28px}
.login-card .lg{height:54px;margin-bottom:18px}.login-card .lg svg,.login-card .lg img{height:100%;width:auto;max-width:100%}
.login-card h2{margin:0;font-size:19px;font-weight:800}
.lg-msg{color:var(--err);font-size:13px;margin-top:10px;min-height:18px}
details.lg-cfg{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.lg-cfg summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--mut)}
/* APP */
#app{display:none;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.side .logo{padding:20px 18px 12px;height:76px}.side .logo svg,.side .logo img{height:40px;width:auto;max-width:100%}
.side nav{flex:1;overflow:auto;padding:6px 10px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:600;font-size:13.5px;text-align:left;margin-bottom:2px}
.nav-i:hover{background:#f4f2f8}.nav-i.on{background:var(--pri-l);color:var(--pri-d)}
.nav-i svg{flex:none}
.nav-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#a29fae;font-weight:700;padding:14px 12px 6px}
.side-foot{border-top:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pu));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.side-foot .nm{flex:1;min-width:0}.side-foot .nm b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.side-foot .nm span{font-size:11px;color:var(--mut)}
.mtop{display:none;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:0;z-index:20}
.mtop .lg svg,.mtop .lg img{height:28px;width:auto}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
main{min-width:0;padding:26px 30px 70px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.01em}.page-h .sub{color:var(--mut);margin-top:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{padding:16px 18px;position:relative;overflow:hidden}.stat b{font-size:28px;display:block;font-weight:800;margin-top:4px}.stat span{color:var(--mut);font-size:12.5px;font-weight:600}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;opacity:.14;background:var(--c,var(--pri))}
h3.sec-t{font-size:15px;margin:26px 0 12px;font-weight:800}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .inp{width:auto;min-width:150px}.toolbar .grow{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
.art{display:flex;flex-direction:column;overflow:hidden;transition:transform .15s,box-shadow .15s}
.art:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(20,10,40,.1)}
.art .th{aspect-ratio:1;display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative}
.art .th img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.art .th .fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#c9c4d3;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.art .th .fav.on{color:#f5a300}.art .th .fav.on svg{fill:#f5a300}
.art .th .st{position:absolute;left:8px;top:8px}
.art .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.art .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .meta{display:flex;gap:4px;flex-wrap:wrap}
.art .acts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.drop{border:2px dashed #d5d0df;border-radius:var(--r);padding:20px;text-align:center;color:var(--mut);margin-bottom:16px;background:#fff;transition:.15s}
.drop.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d)}
.tbw{overflow:auto}
table.tb{width:100%;border-collapse:collapse;min-width:640px}
.tb th,.tb td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:middle}
.tb th{font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.04em;background:#faf9fc}
.tb tr:last-child td{border-bottom:0}
.mini{width:46px;height:46px;border-radius:8px;object-fit:contain;background:#f1eff5;display:block}
.pop{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.16);padding:6px;min-width:200px}
.pop button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;font-size:13px;font-weight:600;text-align:left}
.pop button:hover{background:#f4f2f8}.pop button.danger{color:var(--err)}
.ov{position:fixed;inset:0;background:rgba(18,12,28,.55);display:grid;place-items:center;padding:16px;z-index:60}
.md{background:#fff;border-radius:18px;width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.md-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;gap:10px}
.md-b{padding:16px 20px 20px;overflow:auto}
.md-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.ck{display:flex;align-items:center;gap:7px;font-size:13px;margin:8px 0;cursor:pointer}
.ck input{width:16px;height:16px;accent-color:var(--pri)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--ink);color:#fff;padding:11px 15px;border-radius:12px;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:13px;line-height:1.4;animation:tin .2s}
.toast.err{background:var(--err)}.toast.ok{background:var(--ok)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
#loading{position:fixed;inset:0;background:rgba(255,255,255,.72);display:none;place-items:center;z-index:95;backdrop-filter:blur(2px)}
#loading .bx{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 26px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh);font-weight:600;max-width:90vw}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid #eee;border-top-color:var(--pri);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.colorf{display:flex;gap:4px;align-items:center}
.colorf input[type=color]{width:38px;height:36px;border:1px solid var(--line);border-radius:9px;padding:3px;background:#fff;flex:none;cursor:pointer}
.colorf .inp{min-width:0}
/* EDITOR */
.ed{position:fixed;inset:0;z-index:40;background:#ebe9f0;display:flex;flex-direction:column}
.ed-top{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ed-top .tt{display:flex;align-items:center;gap:8px;flex:1;min-width:220px}
.ed-top .tt input{max-width:280px;font-weight:700}
.ed-top .sep{width:1px;height:24px;background:var(--line)}
.ed-tools{background:#fff;border-bottom:1px solid var(--line);padding:6px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ed-body{flex:1;display:grid;grid-template-columns:250px 1fr 340px;min-height:0}
.ed-left,.ed-right{background:#fff;overflow:auto;min-height:0}
.ed-left{border-right:1px solid var(--line)}.ed-right{border-left:1px solid var(--line)}
.ed-h{padding:11px 14px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}
.stage{overflow:auto;min-height:0;display:flex;padding:28px;position:relative}
.stage-in{margin:auto;line-height:0;box-shadow:0 8px 34px rgba(0,0,0,.2)}
#cv{display:block;touch-action:none}
.stage .hintbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:7px 12px;border-radius:99px;z-index:3;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.layer{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 12px;border-bottom:1px solid #f2f0f5;cursor:pointer;font-size:12.5px}
.layer:hover{background:#faf9fc}.layer.on{background:var(--pri-l)}
.layer.ina .ln{color:var(--mut)}
.layer .ln{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
.layer .ib{border:0;background:none;padding:3px;color:#9a96a6;border-radius:6px;display:grid;place-items:center}.layer .ib:hover{background:#eeeaf3;color:var(--ink)}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.tab{flex:1;border:0;background:none;padding:12px 6px;font-weight:700;font-size:12px;color:var(--mut);border-bottom:2px solid transparent}
.tab.on{color:var(--pri-d);border-bottom-color:var(--pri)}
.pn{padding:12px 14px 30px}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:4px}
.sec>h4{margin:10px 0 2px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
.stbox{border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;margin:8px 0}
.stbox.ina{background:#eef8fd;color:#075d80}.stbox.alt{background:#fff4e5;color:#8a4b00}.stbox.warn{background:#fdecec;color:#991b1b}.stbox.ok{background:#e9f7ef;color:#166534}
.qe{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.qe .qn{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;margin-bottom:4px;display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:#faf9fc;border-radius:99px;padding:5px 10px;font-size:11.5px;font-weight:600}
.chips button:hover{border-color:var(--pri);color:var(--pri-d)}
.plano{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;background:#fcfbfe}
.plano ul{margin:6px 0 10px;padding-left:18px;line-height:1.5}
/* COMPARE */
.cmp-side{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp-side figure{margin:0}.cmp-side figcaption{font-weight:700;font-size:12.5px;margin-bottom:6px;color:var(--mut);text-transform:uppercase}
.cmp-side img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;background:#f1eff5}
.cmp{position:relative;line-height:0;user-select:none;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:0 auto;max-height:70vh}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f1eff5}
.cmp .tp{position:absolute;inset:0}
.cmp .bar{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 0 8px rgba(0,0,0,.4);pointer-events:none}
.cmp .lbl{position:absolute;top:10px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;line-height:1.2}
.alt-list{margin-top:14px;background:#faf9fc;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.alt-list h4{margin:0 0 6px;font-size:12px;text-transform:uppercase}.alt-list ul{margin:0;padding-left:18px;line-height:1.55;font-size:13px}
/* SLIDES */
.sl{position:fixed;inset:0;background:#0d0b12;z-index:80;display:flex;flex-direction:column;color:#fff}
.sl-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;flex-wrap:wrap}
.sl-top b{font-size:15px;display:block}.sl-top span{font-size:12px;opacity:.65}
.sl-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sl-act button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.sl-act button:hover{background:rgba(255,255,255,.2)}
.sl-img{flex:1;display:grid;place-items:center;min-height:0;padding:8px 60px;position:relative}
.sl-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.sl-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.sl-nav:hover{background:rgba(255,255,255,.25)}.sl-nav.l{left:10px}.sl-nav.r{right:10px}
.sl-strip{display:flex;gap:8px;overflow:auto;padding:10px 14px 14px}
.sl-strip img{height:62px;width:62px;object-fit:cover;border-radius:8px;opacity:.5;cursor:pointer;border:2px solid transparent;flex:none;background:#222}
.sl-strip img.on{opacity:1;border-color:var(--pri)}
@media (max-width:1150px){.ed-body{grid-template-columns:210px 1fr 300px}}
@media (max-width:880px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-102%);transition:transform .2s}
  .side.open{transform:none}#scrim.on{display:block}
  .mtop{display:flex}
  main{padding:16px 16px 60px}
  .ed-body{display:flex;flex-direction:column;overflow:auto}
  .stage{min-height:52vh;flex:none;padding:12px}
  .ed-left{order:3;max-height:300px;border-right:0;border-top:1px solid var(--line)}
  .ed-right{order:2;border-left:0;border-top:1px solid var(--line);overflow:visible}
  .cmp-side{grid-template-columns:1fr}
  .sl-img{padding:8px}
  .row4{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="login"></div>
<div id="app">
  <aside class="side" id="side"></aside>
  <div id="scrim"></div>
  <div style="min-width:0">
    <div class="mtop"><button class="btn ghost sm" id="btMenu" aria-label="Menu"></button><div class="lg" id="mLogo"></div></div>
    <main id="main"></main>
  </div>
</div>
<div id="toasts"></div>
<div id="loading"><div class="bx"><div class="spin"></div><span id="ldMsg">Carregando...</span></div></div>

<script>
'use strict';
/* =====================================================================
   MIASHOP · EDITOR INTELIGENTE DE ARTES PROMOCIONAIS — FRONT-END
   ---------------------------------------------------------------------
   API_URL: cole a URL do App da Web do Apps Script (termina em /exec).
   Se ficar vazio, a URL pode ser informada na própria tela de login.
   Quando este arquivo é aberto pelo próprio Apps Script, a URL não é usada.
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzXjkZoaULmMyIFRFsz6vSdB-2kKnuPai1PHCG1EBituKZWwf1NXzNBrdGqFBGqQAS4/exec';

/* --------------------------------------------------------- BÁSICO -- */
const LS = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
const S = { token:null, user:null, cfg:{}, artes:[], versoes:[], campanhas:[], produtos:[], usuarios:[], view:'inicio',
  f:{q:'',cat:'',camp:'',fav:false,ord:'recentes'}, pf:{q:'',st:'',arte:''}, hist:{arte:''}, ap:{camp:'',cat:'',orig:false} };
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const isMaster=()=>!!(S.user&&S.user.perfil==='MASTER');
const podeBaixar=()=>isMaster()||!!(S.user&&S.user.podeBaixar);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const r2=n=>Math.round((+n||0)*100)/100;

/* --------------------------------------------------------- UI -- */
function toast(msg,t=''){ const d=document.createElement('div'); d.className='toast '+t; d.textContent=msg; $('#toasts').appendChild(d); setTimeout(()=>d.remove(),t==='err'?7000:3800); }
let _ld=0;
function carregando(msg){ _ld++; $('#ldMsg').textContent=msg||'Carregando...'; $('#loading').style.display='grid'; }
function pronto(){ _ld=Math.max(0,_ld-1); if(!_ld) $('#loading').style.display='none'; }
async function comCarga(msg,fn){ carregando(msg); try{ return await fn(); }catch(e){ console.error(e); toast(e.message||String(e),'err'); return undefined; } finally{ pronto(); } }

function modal({titulo,corpo,rodape='',largura=520,aoFechar,fixo=false}){
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="md" style="max-width:${largura}px"><div class="md-h"><span>${titulo}</span><button class="btn ghost sm" data-x aria-label="Fechar">${ic('x')}</button></div><div class="md-b">${corpo}</div>${rodape?`<div class="md-f">${rodape}</div>`:''}</div>`;
  document.body.appendChild(ov);
  let fechado=false; const fechar=(sil)=>{ if(fechado) return; fechado=true; ov.remove(); if(!sil&&aoFechar) aoFechar(); };
  ov.querySelector('[data-x]').onclick=()=>fechar();
  if(!fixo) ov.addEventListener('mousedown',e=>{ if(e.target===ov) fechar(); });
  ov.fechar=fechar; return ov;
}
function confirmar(msg,{ok='Confirmar',perigo=false,titulo='Confirmação'}={}){
  return new Promise(res=>{ const m=modal({titulo,corpo:`<div style="line-height:1.55">${msg}</div>`,rodape:`<button class="btn" data-n>Cancelar</button><button class="btn ${perigo?'danger':'pri'}" data-s>${ok}</button>`,aoFechar:()=>res(false)});
    m.querySelector('[data-n]').onclick=()=>m.fechar(); m.querySelector('[data-s]').onclick=()=>{ m.fechar(true); res(true); }; });
}
/** Formulário genérico: campos [{k,l,tipo:'txt'|'senha'|'area'|'sel'|'data'|'cor'|'ck'|'arquivo'|'num',ops,lista,req,ph,hint}] */
function formulario(titulo,campos,val={},{ok='Salvar',largura=520}={}){
  return new Promise(res=>{
    const dl=[]; const h=campos.map((c,i)=>{ const v=val[c.k]??c.padrao??''; const id='ff_'+i;
      if(c.tipo==='ck') return `<label class="ck"><input type="checkbox" id="${id}" ${v?'checked':''}> ${esc(c.l)}</label>${c.hint?`<p class="hint">${c.hint}</p>`:''}`;
      let inp;
      if(c.tipo==='area') inp=`<textarea class="inp" id="${id}" rows="3" placeholder="${esc(c.ph||'')}">${esc(v)}</textarea>`;
      else if(c.tipo==='sel') inp=`<select class="inp" id="${id}">${c.ops.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
      else if(c.tipo==='arquivo') inp=`<input class="inp" id="${id}" type="file" accept="${c.accept||'image/png,image/jpeg,image/webp'}">`;
      else if(c.tipo==='cor') inp=`<div class="colorf"><input type="color" id="${id}" value="${/^#[0-9a-f]{6}$/i.test(v)?v:'#EC2A8F'}"></div>`;
      else { const t={senha:'password',data:'date',num:'number'}[c.tipo]||'text'; if(c.lista){ dl.push(`<datalist id="dl_${i}">${c.lista.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`);} inp=`<input class="inp" id="${id}" type="${t}" value="${esc(v)}" placeholder="${esc(c.ph||'')}" ${c.lista?`list="dl_${i}"`:''} ${t==='password'?'autocomplete="new-password"':''}>`; }
      return `<label class="f" for="${id}">${esc(c.l)}${c.req?' *':''}</label>${inp}${c.hint?`<p class="hint">${c.hint}</p>`:''}`; }).join('')+dl.join('');
    const m=modal({titulo,corpo:`<form id="frm" onsubmit="return false">${h}</form>`,largura,rodape:`<button class="btn" data-n>Cancelar</button><button class="btn pri" data-s>${ok}</button>`,aoFechar:()=>res(null)});
    const ler=()=>{ const o={}; for(let i=0;i<campos.length;i++){ const c=campos[i], el=m.querySelector('#ff_'+i);
        o[c.k]=c.tipo==='ck'?el.checked:c.tipo==='arquivo'?(el.files[0]||null):c.tipo==='num'?(parseFloat(el.value)||0):el.value.trim();
        if(c.req&&!o[c.k]){ toast('Preencha: '+c.l,'err'); el.focus(); return null; } } return o; };
    m.querySelector('[data-n]').onclick=()=>m.fechar();
    m.querySelector('[data-s]').onclick=()=>{ const o=ler(); if(o){ m.fechar(true); res(o); } };
    m.querySelectorAll('input').forEach(el=>el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); m.querySelector('[data-s]').click(); } }));
    const f=m.querySelector('input,textarea,select'); if(f) setTimeout(()=>f.focus(),50);
  });
}
function menuPopup(anchor,itens){
  $$('.pop').forEach(p=>p.remove());
  const p=document.createElement('div'); p.className='pop';
  p.innerHTML=itens.filter(Boolean).map((it,i)=>`<button data-i="${i}" class="${it[3]?'danger':''}">${ic(it[1],15)} ${esc(it[0])}</button>`).join('');
  document.body.appendChild(p);
  const r=anchor.getBoundingClientRect(); const pw=p.offsetWidth, ph=p.offsetHeight;
  p.style.left=Math.max(8,Math.min(r.right-pw,innerWidth-pw-8))+'px'; p.style.top=(r.bottom+ph+8>innerHeight?Math.max(8,r.top-ph-4):r.bottom+4)+'px';
  const lista=itens.filter(Boolean);
  p.onclick=e=>{ const b=e.target.closest('button'); if(!b) return; p.remove(); lista[+b.dataset.i][2](); };
  setTimeout(()=>document.addEventListener('mousedown',function f(e){ if(!p.contains(e.target)){ p.remove(); document.removeEventListener('mousedown',f);} }),0);
}

/* --------------------------------------------------------- API -- */
const emGAS=()=>typeof google!=='undefined'&&google.script&&google.script.run;
const apiUrl=()=>API_URL||LS.get('mia_api_url')||'';
async function api(acao,dados={}){
  const payload=JSON.stringify({acao,token:S.token,dados}); let r;
  if(emGAS()){
    r=await new Promise((ok,er)=>google.script.run.withSuccessHandler(x=>{ try{ok(JSON.parse(x))}catch(e){er(e)} }).withFailureHandler(er).apiRun(payload));
  } else {
    const u=apiUrl(); if(!u) throw new Error('Informe a URL do servidor (Apps Script) na tela de login.');
    let resp; try{ resp=await fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'payload='+encodeURIComponent(payload),redirect:'follow'}); }
    catch(e){ throw new Error('Sem conexão com o servidor. Verifique a internet e a URL do Apps Script.'); }
    try{ r=await resp.json(); }catch(e){ throw new Error('O servidor não respondeu corretamente. Confira se a implantação está como "Qualquer pessoa".'); }
  }
  if(!r||!r.ok){ if(r&&r.sessao===false&&acao!=='login'){ sairLocal('Sua sessão expirou. Entre novamente.'); } throw new Error((r&&r.erro)||'Erro desconhecido'); }
  return r.dados;
}

const IMG=new Map();
function carregarImg(src){ return new Promise((ok,er)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>er(new Error('Falha ao carregar imagem')); i.src=src; }); }
function imgPorId(id){ if(!id) return Promise.resolve(null); if(!IMG.has(id)) IMG.set(id,api('arquivo.obter',{id}).then(a=>carregarImg('data:'+a.mime+';base64,'+a.base64)).catch(e=>{ IMG.delete(id); throw e; })); return IMG.get(id); }
function guardarImg(id,img){ IMG.set(id,Promise.resolve(img)); }
const thumbUrl=(id,w=600)=>`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w}`;
window.thumbFalhou=function(el){ const id=el.dataset.fid, w=el.dataset.w||600; if(!id) return;
  if(!el.dataset.t){ el.dataset.t='1'; el.src=`https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=w${w}`; }
  else if(el.dataset.t==='1'){ el.dataset.t='2'; imgPorId(id).then(i=>{ el.src=i.src; }).catch(()=>{}); } };
const imgTag=(id,w=600,alt='')=>id?`<img loading="lazy" src="${thumbUrl(id,w)}" data-fid="${esc(id)}" data-w="${w}" onerror="thumbFalhou(this)" alt="${esc(alt)}">`:'';
function lerArquivo(file){ return new Promise((ok,er)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>er(new Error('Não foi possível ler o arquivo.')); r.readAsDataURL(file); }); }
/** Lê a imagem, reduz se passar de "max" px e devolve {mime,b64,w,h,dataUrl,img} */
async function prepararImagem(file,max=4096){
  const dataUrl=await lerArquivo(file); const img=await carregarImg(dataUrl);
  let w=img.naturalWidth,h=img.naturalHeight, mime=/png|webp|jpeg/.test(file.type)?file.type:'image/png';
  if(Math.max(w,h)>max||file.size>15e6){ const k=max/Math.max(w,h); w=Math.round(w*Math.min(1,k)); h=Math.round(h*Math.min(1,k));
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(img,0,0,w,h);
    if(mime==='image/webp') mime='image/png'; const du=c.toDataURL(mime,0.95); const im2=await carregarImg(du); return {mime,b64:du.split(',')[1],w,h,dataUrl:du,img:im2}; }
  return {mime,b64:dataUrl.split(',')[1],w,h,dataUrl,img};
}
function baixarBlob(blob,nome){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
  if(emGAS()){ const du=URL.createObjectURL(blob); modal({titulo:'Download',largura:560,corpo:`<p class="hint">Se o download não começar automaticamente, clique com o botão direito na imagem e escolha "Salvar imagem como".</p><img src="${du}" style="width:100%;margin-top:10px;border-radius:10px">`}); } }

/* -------------------------------------------- REMOÇÃO DE FUNDO -- */
async function removerFundo(dataUrl){
  try{
    const mod=await Promise.race([import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/+esm'),sleep(30000).then(()=>{throw new Error('timeout')})]);
    const fn=mod.removeBackground||mod.default;
    const blob=await Promise.race([fn(dataUrl),sleep(120000).then(()=>{throw new Error('timeout')})]);
    const du=await lerArquivo(blob); return await recortarTransparente(du);
  }catch(e){ console.warn('Remoção avançada indisponível',e); toast('Remoção avançada indisponível neste navegador — usando remoção pela cor do fundo.'); return removerFundoSimples(dataUrl); }
}
async function removerFundoSimples(dataUrl,tol=42){
  const img=await carregarImg(dataUrl); const W=img.naturalWidth,H=img.naturalHeight; const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0); const d=x.getImageData(0,0,W,H); const p=d.data;
  const cant=[[0,0],[W-1,0],[0,H-1],[W-1,H-1]].map(([a,b])=>{const i=(b*W+a)*4; return [p[i],p[i+1],p[i+2]];});
  const ref=[0,1,2].map(k=>cant.reduce((s,c)=>s+c[k],0)/4);
  const vis=new Uint8Array(W*H); const pilha=[]; const dist=i=>Math.abs(p[i]-ref[0])+Math.abs(p[i+1]-ref[1])+Math.abs(p[i+2]-ref[2]);
  for(let a=0;a<W;a++){ pilha.push(a, (H-1)*W+a); } for(let b=0;b<H;b++){ pilha.push(b*W, b*W+W-1); }
  while(pilha.length){ const q=pilha.pop(); if(vis[q]) continue; vis[q]=1; const i=q*4; const dd=dist(i); if(dd>tol*3) continue;
    p[i+3]=dd<tol*1.6?0:Math.min(p[i+3],Math.round((dd-tol*1.6)/(tol*1.4)*255));
    const a=q%W, b=(q/W)|0; if(a>0&&!vis[q-1]) pilha.push(q-1); if(a<W-1&&!vis[q+1]) pilha.push(q+1); if(b>0&&!vis[q-W]) pilha.push(q-W); if(b<H-1&&!vis[q+W]) pilha.push(q+W); }
  x.putImageData(d,0,0); return recortarTransparente(c.toDataURL('image/png'));
}
async function recortarTransparente(dataUrl){
  const img=await carregarImg(dataUrl); const W=img.naturalWidth,H=img.naturalHeight; const c=document.createElement('canvas'); c.width=W;c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0); const p=x.getImageData(0,0,W,H).data;
  let x0=W,y0=H,x1=-1,y1=-1; for(let y=0;y<H;y+=1) for(let a=0;a<W;a+=1){ if(p[(y*W+a)*4+3]>12){ if(a<x0)x0=a; if(a>x1)x1=a; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1<0) return dataUrl; const w=x1-x0+1,h=y1-y0+1; const o=document.createElement('canvas'); o.width=w;o.height=h; o.getContext('2d').drawImage(c,x0,y0,w,h,0,0,w,h); return o.toDataURL('image/png');
}

    <select class="inp" id="fCamp"><option value="">Todas as campanhas</option>${S.campanhas.map(c=>`<option value="${c.id}" ${c.id===f.camp?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>
    <select class="inp" id="fOrd"><option value="recentes">Mais recentes</option><option value="nome" ${f.ord==='nome'?'selected':''}>Nome A–Z</option><option value="data" ${f.ord==='data'?'selected':''}>Data de referência</option></select>
    <button class="btn ${f.fav?'on':''}" id="fFav">${ic('star',15)} Favoritas</button></div><div id="grade"></div>`;
  const upd=()=>gradeArtes();
  $('#fQ').oninput=e=>{ f.q=e.target.value; upd(); };
  $('#fCat').onchange=e=>{ f.cat=e.target.value; upd(); };
  $('#fCamp').onchange=e=>{ f.camp=e.target.value; upd(); };
  $('#fOrd').onchange=e=>{ f.ord=e.target.value; upd(); };
  $('#fFav').onclick=e=>{ f.fav=!f.fav; e.currentTarget.classList.toggle('on',f.fav); upd(); };
  if(isMaster()){ const d=$('#drop'), inp=$('#fUp');
    $('#btUp').onclick=()=>inp.click(); d.onclick=()=>inp.click(); inp.onchange=()=>{ enviarArtes(inp.files); inp.value=''; };
    ['dragenter','dragover'].forEach(t=>d.addEventListener(t,e=>{ e.preventDefault(); d.classList.add('on'); }));
    ['dragleave','drop'].forEach(t=>d.addEventListener(t,e=>{ e.preventDefault(); d.classList.remove('on'); }));
    d.addEventListener('drop',e=>enviarArtes(e.dataTransfer.files)); }
  upd();
};
function filtrarArtes(){
  const f=S.f, q=f.q.toLowerCase().trim();
  let l=S.artes.filter(a=>(!f.cat||a.categoria===f.cat)&&(!f.camp||a.campanhaId===f.camp)&&(!f.fav||a.favorita)&&(!q||[a.nome,a.tags,a.categoria,(campDe(a.campanhaId)||{}).nome].join(' ').toLowerCase().includes(q)));
  if(f.ord==='nome') l.sort((a,b)=>a.nome.localeCompare(b.nome)); else if(f.ord==='data') l.sort((a,b)=>String(b.dataRef).localeCompare(String(a.dataRef))); else l.sort((a,b)=>String(b.criadoEm).localeCompare(String(a.criadoEm)));
  return l;
}
function gradeArtes(){ const l=filtrarArtes(); $('#grade').innerHTML=l.length?`<div class="grid">${l.map(cardArte).join('')}</div>`:`<div class="empty">${S.artes.length?'Nenhuma arte encontrada com esses filtros.':isMaster()?'Sua biblioteca está vazia. Envie as artes promocionais da MIASHOP para começar.':'Nenhuma arte disponível.'}</div>`; ligarCards($('#grade')); }
async function enviarArtes(lista){
  const files=[...lista].filter(f=>/^image\/(png|jpe?g|webp)$/.test(f.type));
  if(!files.length) return toast('Envie arquivos PNG, JPG, JPEG ou WEBP.','err');
  const op=await formulario(`Enviar ${files.length} arte(s)`,[{k:'categoria',l:'Categoria (opcional)',lista:categorias(),ph:'Ex.: Utilidades, Decoração, Cama/Mesa/Banho'},{k:'campanhaId',l:'Campanha (opcional)',tipo:'sel',ops:[['','— Nenhuma —'],...S.campanhas.map(c=>[c.id,c.nome])]},{k:'tags',l:'Palavras-chave (opcional)',ph:'Ex.: black friday, panela, cozinha'},{k:'dataRef',l:'Data de referência (opcional)',tipo:'data'}],{campanhaId:S.f.camp},{ok:'Enviar'});
  if(!op) return; let ok=0;
  for(let i=0;i<files.length;i++){ carregando(`Enviando ${i+1} de ${files.length}: ${files[i].name}`);
    try{ const p=await prepararImagem(files[i]); const r=await api('artes.importar',{nome:files[i].name.replace(/\.[^.]+$/,''),mime:p.mime,base64:p.b64,largura:p.w,altura:p.h,...op}); S.artes.push(r.arte); guardarImg(r.arte.arquivoId,p.img); ok++; }
    catch(e){ toast(files[i].name+': '+e.message,'err'); } finally{ pronto(); } }
  if(ok) toast(`${ok} arte(s) adicionada(s) à biblioteca.`,'ok'); if(S.view==='biblioteca') gradeArtes();
}
async function editarDadosArte(a){
  const o=await formulario('Informações da arte',[{k:'nome',l:'Nome',req:true},{k:'categoria',l:'Categoria',lista:categorias()},{k:'campanhaId',l:'Campanha',tipo:'sel',ops:[['','— Nenhuma —'],...S.campanhas.map(c=>[c.id,c.nome])]},{k:'produtos',l:'Produtos relacionados',ph:'Nomes ou códigos separados por vírgula'},{k:'tags',l:'Palavras-chave'},{k:'dataRef',l:'Data de referência',tipo:'data'},{k:'favorita',l:'Favorita',tipo:'ck'}],a);
  if(!o) return; const r=await comCarga('Salvando...',()=>api('artes.salvar',{arte:{id:a.id,...o}})); if(r){ upsertLista(S.artes,r.arte); toast('Informações salvas.','ok'); (VIEWS[S.view]||VIEWS.inicio)(); }

async function duplicarArte(a){

async function excluirArte(a){

  const upd=()=>{ const l=itens(); $('#apG').innerHTML=l.length?`<div class="grid">${l.map((it,i)=>`<div class="card art"><div class="th checker" data-i="${i}">${imgTag(it.fid,500,it.titulo)}</div><div class="bd"><div class="nm">${esc(it.titulo)}</div><div class="hint" style="margin:0">${esc(it.sub)}</div></div></div>`).join('')}</div>`:`<div class="empty">Nenhuma arte aprovada com esses filtros.</div>`;

function abrirSlides(itens,ini=0,autoplay=false){
  if(!itens.length) return; let i=ini, timer=null;
  const el=document.createElement('div'); el.className='sl'; document.body.appendChild(el);
  el.innerHTML=`<div class="sl-top"><div><b id="slT"></b><span id="slS"></span></div><div class="sl-act"><span id="slN" style="font-size:12.5px;opacity:.7;margin-right:4px"></span>
    ${itens.length>1?`<button data-a="auto"></button>`:''}${podeBaixar()?`<button data-a="dl">${ic('dl',15)} Baixar</button>`:''}<button data-a="fs">${ic('full',15)} Tela cheia</button><button data-a="x">${ic('x',15)} Fechar</button></div></div>
    <div class="sl-img">${itens.length>1?`<button class="sl-nav l" data-a="p" aria-label="Anterior">${ic('left',22)}</button>`:''}<img id="slI" alt=""><button class="sl-nav r" data-a="n" aria-label="Próxima" ${itens.length>1?'':'hidden'}>${ic('right',22)}</button></div>
    ${itens.length>1?`<div class="sl-strip">${itens.map((it,k)=>`<img data-k="${k}" src="${thumbUrl(it.fid,200)}" data-fid="${esc(it.fid)}" data-w="200" onerror="thumbFalhou(this)" loading="lazy" alt="">`).join('')}</div>`:''}`;
  const show=()=>{ const it=itens[i]; $('#slT',el).textContent=it.titulo; $('#slS',el).textContent=it.sub||''; $('#slN',el).textContent=`${i+1} / ${itens.length}`;
    const im=$('#slI',el); im.removeAttribute('data-t'); im.dataset.fid=it.fid; im.dataset.w=2000; im.onerror=()=>thumbFalhou(im); im.src=thumbUrl(it.fid,2000);
    $$('.sl-strip img',el).forEach(t=>t.classList.toggle('on',+t.dataset.k===i)); const at=$(`.sl-strip img[data-k="${i}"]`,el); if(at) at.scrollIntoView({block:'nearest',inline:'center'});
    const b=$('[data-a=auto]',el); if(b) b.innerHTML=timer?`${ic('minus',15)} Pausar`:`${ic('play',15)} Reproduzir`; };
  const ir=d=>{ i=(i+d+itens.length)%itens.length; show(); };
  const auto=()=>{ if(timer){ clearInterval(timer); timer=null; } else timer=setInterval(()=>ir(1),5000); show(); };
  const fechar=()=>{ clearInterval(timer); document.removeEventListener('keydown',kb); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); el.remove(); };
  const kb=e=>{ if(e.key==='ArrowRight') ir(1); else if(e.key==='ArrowLeft') ir(-1); else if(e.key==='Escape') fechar(); };
  document.addEventListener('keydown',kb);
  el.onclick=e=>{ const t=e.target.closest('[data-a],[data-k]'); if(!t) return; if(t.dataset.k!==undefined){ i=+t.dataset.k; show(); return; }
    const a=t.dataset.a; if(a==='n') ir(1); if(a==='p') ir(-1); if(a==='x') fechar(); if(a==='auto') auto();
    if(a==='fs'){ if(document.fullscreenElement) document.exitFullscreen(); else el.requestFullscreen&&el.requestFullscreen().catch(()=>{}); }
    if(a==='dl'){ const it=itens[i]; exportarModal(()=>imgPorId(it.fid),slug(it.titulo)); } };
  let x0=null; el.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; },{passive:true}); el.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50) ir(dx<0?1:-1); x0=null; });
  if(autoplay&&itens.length>1) timer=setInterval(()=>ir(1),5000);
  show();
}

    const k=t==='orig'?1:(enc==='cobrir'?Math.max(tw/sw,th/sh):Math.min(tw/sw,th/sh)); const dw=sw*k, dh=sh*k;

/** Redução em etapas (mais nitidez em textos ao diminuir bastante) */
function reduzir(src,dw,dh){ let w=src.naturalWidth||src.width, h=src.naturalHeight||src.height, cur=src;
  while(w/2>dw&&h/2>dh){ w=Math.round(w/2); h=Math.round(h/2); const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(cur,0,0,w,h); cur=c; }
  return cur; }

function ligarPainel(p,c){
  const rev=$('#eRev',p); if(rev) rev.onclick=e=>{ e.preventDefault(); reverterCamada(c.id); };
  const aplicar=(el)=>{ const k=el.dataset.k; let v=el.type==='checkbox'?el.checked:el.dataset.t==='n'?(parseFloat(el.value)||0):el.value; guardar();
    if(k==='_fundo'){ c.fundoCor=v?(c.fundoCor||'#EC2A8F'):''; if(v&&!c.fundoPad) c.fundoPad=Math.round(c.h*0.1); c.ativo=true; painel(); agendar(); return; }
    if(el.type==='color'||(el.dataset.k&&/Cor$|^cor$/.test(k)&&el.type==='text')){ if(el.type==='text'&&v&&!/^#[0-9a-f]{6}$/i.test(v)) return; }
    c[k]=v; if(!CAMPOS_ESTRUTURA.includes(k)&&c.tipo!=='regiao') c.ativo=true;
    if(k==='ativo'||k==='bloqueado'||k==='visivel'||k==='nome') listaCamadas();
    $$(`[data-k="${k}"]`,p).forEach(o=>{ if(o!==el&&o.type!=='checkbox') o.value=v; }); const rv=$(`[data-rv="${k}"]`,p); if(rv) rv.textContent=r2(v)+(k==='brilho'||k==='contraste'||k==='saturacao'?'%':'');
    if(['cobrirModo','forma','fonte'].includes(k)){ if(k==='fonte'&&document.fonts) document.fonts.load(fonteCss(c,40)).then(agendar).catch(()=>{}); if(k!=='fonte') painel(); }
    if(c.ativo&&$('.stbox.ina',p)&&!CAMPOS_ESTRUTURA.includes(k)){ const sb=$('.stbox.ina',p); sb.className='stbox alt'; sb.innerHTML='<b>Elemento alterado.</b> Somente esta região é modificada; o restante da arte é preservado.'; listaCamadas(); }
    atualizarTopo(); agendar(); };
  $$('[data-k]',p).forEach(el=>{ el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input',()=>aplicar(el)); });
  $$('[data-pick]',p).forEach(b=>b.onclick=()=>{ ED.pick=b.dataset.pick; modo('conta-gotas'); });
  $$('[data-op]',p).forEach(b=>b.onclick=async()=>{ const op=b.dataset.op;
    if(op==='up') moverOrdem(c.id,1); if(op==='dn') moverOrdem(c.id,-1); if(op==='dup') duplicarCamada(c.id); if(op==='del') excluirCamada(c.id); if(op==='fechar') selecionar(null);
    if(op==='cob'){ ED.cob=!ED.cob; painel(); agendar(); }
    if(op==='cobcaixa'){ guardar(true); const pad=Math.max(2,Math.round(Math.min(c.w,c.h)*0.06)); Object.assign(c,{cobrirX:c.x-pad,cobrirY:c.y-pad,cobrirW:c.w+pad*2,cobrirH:c.h+pad*2}); painel(); agendar(); }
    if(op==='trocar') dialogoImagem(c);
    if(op==='encaixar'){ guardar(true); encaixarImagem(c,ED.imgs[c.imagemId]); painel(); agendar(); }
    if(op==='semfundo') removerFundoCamada(c);
    if(op==='imgorig'){ guardar(true); const id=c.imagemOriginalId; const im=await comCarga('Carregando...',()=>imgPorId(id)); if(im){ ED.imgs[id]=im; c.imagemId=id; painel(); agendar(); } }
    if(op==='sombra'){ guardar(true); Object.assign(c,{sombraCor:'#00000066',sombraDesfoque:Math.round(c.h*0.06),sombraX:0,sombraY:Math.round(c.h*0.03)}); painel(); agendar(); }
    if(op==='semsombra'){ guardar(true); Object.assign(c,{sombraDesfoque:0,sombraX:0,sombraY:0}); painel(); agendar(); } });
}

/* ---- imagens / produtos no editor ---- */
function encaixarImagem(c,im){ if(!im) return; const iw=im.naturalWidth||im.width, ih=im.naturalHeight||im.height; const bx={x:c.x,y:c.y,w:c.w,h:c.h};
  const k=Math.min(bx.w/iw,bx.h/ih); const w=iw*k,h=ih*k; c.x=bx.x+(bx.w-w)/2; c.y=bx.y+bx.h-h; c.w=w; c.h=h; }
async function enviarImagemCamada(dataUrl,nome){ const mime=dataUrl.slice(5,dataUrl.indexOf(';')); const r=await api('arquivo.enviar',{nome:nome||'imagem',mime,base64:dataUrl.split(',')[1],pasta:'produtos'}); const im=await carregarImg(dataUrl); guardarImg(r.id,im); ED.imgs[r.id]=im; return r.id; }
async function colocarImagem(alvo,id,im){
  guardar(true); ED.imgs[id]=im;
  if(alvo){ if(!(alvo.cobrirW>0)&&alvo.ativo===false){ const pad=Math.max(2,Math.round(Math.min(alvo.w,alvo.h)*0.04)); Object.assign(alvo,{cobrirModo:'auto',cobrirX:alvo.x-pad,cobrirY:alvo.y-pad,cobrirW:alvo.w+pad*2,cobrirH:alvo.h+pad*2}); }
    if(!alvo.imagemId) encaixarImagem(alvo,im); else { const iw=im.naturalWidth,ih=im.naturalHeight; const cx=alvo.x+alvo.w/2, by=alvo.y+alvo.h; const k=Math.min(alvo.w/iw,alvo.h/ih); alvo.w=iw*k; alvo.h=ih*k; alvo.x=cx-alvo.w/2; alvo.y=by-alvo.h; }
    alvo.imagemId=id; alvo.imagemOriginalId=id; alvo.ativo=true; selecionar(alvo.id); }
  else { const iw=im.naturalWidth, ih=im.naturalHeight, k=Math.min(ED.W*0.45/iw,ED.H*0.45/ih); const c=novaCamada('imagem',{nome:'Produto',categoria:'produto',imagemId:id,imagemOriginalId:id,w:iw*k,h:ih*k,x:(ED.W-iw*k)/2,y:(ED.H-ih*k)/2}); ED.camadas.push(c); selecionar(c.id); }
  atualizarTopo(); agendar();
}

async function removerFundoCamada(c){ const im=ED.imgs[c.imagemId]; if(!im) return;
  const r=await comCarga('Removendo o fundo (na primeira vez pode levar até 1 minuto)...',async()=>{ const cv=document.createElement('canvas'); cv.width=im.naturalWidth; cv.height=im.naturalHeight; cv.getContext('2d').drawImage(im,0,0); const du=await removerFundo(cv.toDataURL('image/png')); $('#ldMsg').textContent='Salvando no Google Drive...'; return {id:await enviarImagemCamada(du,'produto sem fundo')}; });
  if(r){ guardar(true); const ant={x:c.x,y:c.y,w:c.w,h:c.h}; c.imagemOriginalId=c.imagemOriginalId||c.imagemId; c.imagemId=r.id; Object.assign(c,ant); encaixarImagem(c,ED.imgs[r.id]); painel(); agendar(); toast('Fundo removido.','ok'); } }

/* ---- IA: análise da arte ---- */
async function analisarIA(){
  if(!S.cfg.iaConfigurada) return toast('Configure a chave da IA em Integração para usar a análise automática. Enquanto isso, use "Marcar região".','err');
  if(ED.baseId!==ED.arte.arquivoId&&!await confirmar('Esta versão usa uma base gerada por IA. Analisar esta imagem mesmo assim?')) return;
  const existentes=ED.camadas.length;
  if(existentes&&!await confirmar(`Já existem ${existentes} camada(s). A análise vai <b>acrescentar</b> os elementos detectados (nada será alterado na arte até você editar).`,{ok:'Analisar'})) return;
  const r=await comCarga('A IA está analisando a arte...',()=>api('ia.analisar',{arquivoId:ED.baseId})); if(!r) return;
  const novas=camadasDeAnalise(r.elementos||[]); if(!novas.length) return toast('A IA não identificou elementos editáveis. Use "Marcar região".','err');
  guardar(true); const ord={regiao:0,imagem:1,forma:2,texto:3,preco:4}; novas.sort((a,b)=>ord[a.tipo]-ord[b.tipo]); ED.camadas.push(...novas);
  const fs=[...new Set(novas.map(c=>c.fonte))]; if(document.fonts) await Promise.all(fs.map(f=>document.fonts.load(`800 40px "${f}"`).catch(()=>{})));
  ED.sel=null; atualizarTudo(); toast(`${novas.length} elemento(s) mapeado(s). A arte continua idêntica ao original até você alterar algum.`,'ok');
  if(ED.baseId===ED.arte.arquivoId&&await confirmar('Deseja salvar este mapeamento como <b>modelo editável</b> desta arte? Assim as próximas edições já começam com os elementos identificados.',{ok:'Salvar modelo'})) salvarModelo(true);
}
function camadasDeAnalise(els){
  const hx=v=>/^#[0-9a-f]{6}$/i.test(String(v||'').trim())?String(v).trim():'';
  return els.map(e=>{ const b=e.box_2d||e.box||[]; if(b.length!==4) return null;
    const y=b[0]/1000*ED.H, x=b[1]/1000*ED.W, h=(b[2]-b[0])/1000*ED.H, w=(b[3]-b[1])/1000*ED.W; if(w<4||h<4) return null;
    const pad=Math.max(2,Math.round(h*0.1)); const cob={cobrirModo:'auto',cobrirX:x-pad,cobrirY:y-pad,cobrirW:w+pad*2,cobrirH:h+pad*2};
    const cat=CATS[e.categoria]?e.categoria:'outro'; const txt=String(e.texto||'').trim();
    const base={...cob,ativo:false,categoria:cat,x,y,w,h,nome:(CATS[cat]||'Elemento')+(txt?': '+txt.slice(0,22):'')};
    const estilo={cor:hx(e.cor_texto)||'#000000',peso:e.negrito===false?'500':'800',italico:!!e.italico,alinhamento:['left','center','right'].includes(e.alinhamento)?e.alinhamento:'center',
      fonte:FONTES.includes(e.fonte_sugerida)?e.fonte_sugerida:'Montserrat',contornoCor:hx(e.contorno)||'#000000',contornoLarg:hx(e.contorno)?Math.max(1,Math.round(h*0.03)):0,tamanho:Math.round(h),autoAjuste:true};
    if(e.tipo==='logo'||cat==='logo') return novaCamada('regiao',{...base,cobrirModo:'nenhum',bloqueado:true,ativo:true,nome:'Logotipo (protegido)',categoria:'logo'});
    if(e.tipo==='produto'||cat==='produto') return novaCamada('imagem',{...base,nome:'Produto'+(txt?': '+txt.slice(0,22):'')});
    if((e.tipo==='preco'||cat==='preco')&&cat!=='preco_antigo'){ const v=txt.replace(/^.*?R\$\s*/i,'').replace(/\s+/g,'').trim(); return novaCamada('preco',{...base,...estilo,categoria:'preco',precoValor:v,precoPrefixo:/R\$/i.test(txt)?'R$':''}); }
    if(!txt) return e.tipo==='selo'?novaCamada('regiao',{...base,cobrirModo:'nenhum',ativo:true,nome:'Selo (original)',categoria:'selo'}):null;
    return novaCamada('texto',{...base,...estilo,texto:txt,maiusculas:false});
  }).filter(Boolean);
}

  <textarea class="inp" id="iaCmd" rows="4" placeholder="Ex.: Troque somente o preço para R$ 89,90">${esc(ED.cmd||'')}</textarea>
  <div class="chips">${EXEMPLOS.map(x=>`<button data-ex="${esc(x)}">${esc(x)}</button>`).join('')}</div>
  <label class="f">Nova imagem do produto (opcional)</label><div class="toolbar" style="margin:0"><button class="btn sm" id="iaImgB">${ic('upl',14)} ${ED.iaImg?'Trocar imagem':'Anexar imagem'}</button>${ED.iaImg?`<img src="${ED.iaImg.dataUrl}" style="height:40px;border-radius:6px;border:1px solid var(--line)"><button class="btn ghost sm" id="iaImgX">${ic('x',14)}</button>`:''}<input type="file" id="iaImgF" accept="image/png,image/jpeg,image/webp" hidden></div>
  <label class="ck"><input type="checkbox" id="iaBg" ${ED.iaBg!==false?'checked':''}> Remover o fundo da imagem anexada</label>
  <button class="btn pri" id="iaGo" style="width:100%;margin-top:8px">${ic('wand',15)} Interpretar comando</button><div id="iaPlano"></div></div>`;
  $('#iaCmd',p).oninput=e=>ED.cmd=e.target.value;
  $$('[data-ex]',p).forEach(b=>b.onclick=()=>{ $('#iaCmd',p).value=b.dataset.ex; ED.cmd=b.dataset.ex; $('#iaCmd',p).focus(); });
  $('#iaImgB',p).onclick=()=>$('#iaImgF',p).click();
  $('#iaImgF',p).onchange=async e=>{ const f=e.target.files[0]; if(!f) return; ED.iaImg=await prepararImagem(f,2400); ED.iaImg.nome=f.name; painelComando(p); };
  const x=$('#iaImgX',p); if(x) x.onclick=()=>{ ED.iaImg=null; painelComando(p); };
  $('#iaBg',p).onchange=e=>ED.iaBg=e.target.checked;
  $('#iaGo',p).onclick=interpretarComando;
  if(ED.plano) mostrarPlano();
}
const resumoCamadas=()=>ED.camadas.map(c=>({id:c.id,tipo:c.tipo,nome:c.nome,categoria:c.categoria,texto:c.tipo==='texto'?c.texto:undefined,precoValor:c.tipo==='preco'?c.precoValor:undefined,precoPrefixo:c.tipo==='preco'?c.precoPrefixo:undefined,protegida:c.tipo==='regiao'||undefined,temImagem:c.tipo==='imagem'?!!c.imagemId:undefined}));
async function interpretarComando(){
  const cmd=($('#iaCmd').value||'').trim(); if(!cmd) return toast('Escreva o comando.','err');
  let plano;
  if(S.cfg.iaConfigurada){ plano=await comCarga('Interpretando o comando...',()=>api('ia.planejar',{comando:cmd,camadas:resumoCamadas(),temImagem:!!ED.iaImg})); if(!plano) return; }
  else plano=planoLocal(cmd,!!ED.iaImg);
  plano.operacoes=(plano.operacoes||[]).filter(o=>{ const c=camId(o.camadaId); return c&&c.tipo!=='regiao'; });
  if(plano.trocarProduto&&!camId(plano.trocarProduto.camadaId)) plano.trocarProduto=null;
  if(plano.trocarProduto&&!ED.iaImg) (plano.perguntas=plano.perguntas||[]).push('Para trocar o produto, anexe a imagem do novo produto.');
  ED.plano=plano; mostrarPlano();
}
function planoLocal(cmd,temImg){
  const ops=[], perg=[], L=ED.camadas, cats=(...k)=>L.filter(c=>k.includes(c.categoria));
  const precos=L.filter(c=>c.tipo==='preco'), promo=precos.filter(c=>c.categoria!=='preco_antigo'), antigos=cats('preco_antigo');
  const valores=[...cmd.matchAll(/R\$\s*(\d{1,3}(?:\.\d{3})*,\d{2}|\d+(?:,\d{2})?)/gi)].map(m=>m[1]);
  if(valores.length){ if(/\bde\b.*\bpor\b/i.test(cmd)&&valores.length>=2){ if(antigos[0]) ops.push({camadaId:antigos[0].id,campos:antigos[0].tipo==='preco'?{precoValor:valores[0]}:{texto:antigos[0].texto.replace(/\d{1,3}(?:\.\d{3})*,\d{2}/,valores[0])}}); else perg.push('Não encontrei o preço antigo (DE) mapeado.');
      if(promo[0]) ops.push({camadaId:promo[0].id,campos:{precoValor:valores[1]}}); }
    else if(promo.length){ ops.push({camadaId:promo[0].id,campos:{precoValor:valores[0]}}); if(promo.length>1) perg.push(`Há ${promo.length} preços nesta arte; o plano altera "${rotCamada(promo[0])}". Se for outro, selecione-o e edite diretamente.`); }
    else perg.push('Não há camada de preço mapeada. Use "Marcar região → Preço a substituir" ou "Analisar com IA".'); }
  const aspas=cmd.match(/["“'‘]([^"”'’]+)["”'’]/), depois=cmd.match(/(?:para|por)\s*:?\s*["“']?([^"”']+?)["”']?\s*$/i);
  const novoTexto=aspas?aspas[1]:depois?depois[1]:'';
  if(/t[ií]tulo/i.test(cmd)&&novoTexto&&!valores.length){ const t=cats('titulo')[0]||L.find(c=>c.tipo==='texto'); if(t) ops.push({camadaId:t.id,campos:{texto:novoTexto}}); else perg.push('Não encontrei um título mapeado.'); }
  else if(/(frase|chamada|texto|mensagem)/i.test(cmd)&&novoTexto&&!valores.length){ const t=cats('chamada','frase','urgencia','subtitulo')[0]; if(t) ops.push({camadaId:t.id,campos:{texto:novoTexto}}); else perg.push('Qual texto deve ser alterado? Selecione-o na arte e edite diretamente.'); }
  const pct=cmd.match(/(\d{1,2})\s*%/); if(pct&&/desconto|off|%/i.test(cmd)){ const t=cats('desconto')[0]; if(t) ops.push({camadaId:t.id,campos:{texto:/\d{1,2}\s*%/.test(t.texto)?t.texto.replace(/\d{1,2}(\s*)%/,pct[1]+'$1%'):pct[1]+'% OFF'}}); else perg.push('Não encontrei o percentual de desconto mapeado.'); }
  let troca=null; if(/produto|imagem/i.test(cmd)&&/(troc|substitu|mud)/i.test(cmd)){ const t=cats('produto').find(c=>c.tipo==='imagem')||L.find(c=>c.tipo==='imagem'); if(t) troca={camadaId:t.id}; else perg.push('Marque a região do produto atual (Marcar região → Produto) para que a troca respeite a composição.'); }
  let gen=''; if(/fundo|elegante|moderno|ilumina|cen[aá]rio|ambienta/i.test(cmd)&&!ops.length&&!troca) gen=cmd;
  if(!ops.length&&!troca&&!gen&&!perg.length) perg.push('Não consegui identificar a alteração. Tente: "Troque somente o preço para R$ 89,90".');
  return {resumo:[],operacoes:ops,trocarProduto:troca,novasCamadas:[],edicaoGenerativa:gen,perguntas:perg};
}
function descreverOp(o){ const c=camId(o.camadaId); const n=rotCamada(c); const f=o.campos||{}; const l=[];
  if(f.texto!==undefined) l.push(`${n}: "${c.texto}" → "${f.texto}"`);
  if(f.precoValor!==undefined) l.push(`Preço (${n}): ${c.precoPrefixo||''} ${c.precoValor||'—'} → ${f.precoPrefixo??c.precoPrefixo??''} ${f.precoValor}`);
  ['cor','fundoCor','preenchCor','fonte'].forEach(k=>{ if(f[k]!==undefined) l.push(`${n}: ${k==='fonte'?'fonte':'cor'} → ${f[k]}`); });
  if(f.visivel!==undefined) l.push(`${n}: ${f.visivel?'mostrar':'ocultar'}`); return l; }
function mostrarPlano(){
  const el=$('#iaPlano'); if(!el) return; const pl=ED.plano; if(!pl){ el.innerHTML=''; return; }
  const linhas=[].concat(...(pl.operacoes||[]).map(descreverOp)); if(pl.trocarProduto) linhas.push(`Substituir a imagem de "${rotCamada(camId(pl.trocarProduto.camadaId))}" pela imagem anexada`);
  (pl.novasCamadas||[]).forEach(n=>linhas.push(`Adicionar texto: "${n.texto}"`));
  const n=ED.camadas.length-new Set([...(pl.operacoes||[]).map(o=>o.camadaId),pl.trocarProduto&&pl.trocarProduto.camadaId].filter(Boolean)).size;
  const podeAplicar=linhas.length&&!(pl.trocarProduto&&!ED.iaImg);
  el.innerHTML=`<div class="plano"><b>Plano de alterações</b>${(pl.resumo||[]).length?`<ul>${pl.resumo.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${linhas.length?`<div class="hint" style="margin-top:6px"><b>Será alterado:</b></div><ul>${linhas.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="hint"><b>Será preservado:</b> todos os demais elementos (${Math.max(0,n)}), logotipo, imagens e composição.</div>`:''}
    ${(pl.perguntas||[]).length?`<div class="stbox warn" style="margin-top:10px">${pl.perguntas.map(esc).join('<br>')}</div>`:''}
    ${pl.edicaoGenerativa?`<div class="stbox ina" style="margin-top:10px">Parte do pedido exige edição visual por IA: <i>${esc(pl.edicaoGenerativa)}</i><br><button class="btn sm" id="plGen" style="margin-top:6px">Levar para Edição visual IA</button></div>`:''}
    <div class="toolbar" style="margin:12px 0 0">${podeAplicar?`<button class="btn pri sm" id="plOk">${ic('check',14)} Confirmar e aplicar</button>`:''}<button class="btn sm" id="plX">Cancelar</button></div></div>`;
  const ok=$('#plOk'); if(ok) ok.onclick=aplicarPlano; $('#plX').onclick=()=>{ ED.plano=null; mostrarPlano(); };
  const g=$('#plGen'); if(g) g.onclick=()=>{ ED.ivTxt=pl.edicaoGenerativa; ED.aba='vis'; painel(); };
}
async function aplicarPlano(){
  const pl=ED.plano; if(!pl) return; guardar(true);
  const PERM=['texto','precoValor','precoPrefixo','precoSufixo','cor','fundoCor','preenchCor','contornoCor','fonte','visivel','maiusculas'];
  for(const o of pl.operacoes||[]){ const c=camId(o.camadaId); if(!c||c.tipo==='regiao') continue; Object.entries(o.campos||{}).forEach(([k,v])=>{ if(PERM.includes(k)) c[k]=v; }); c.ativo=true; }
  for(const n of pl.novasCamadas||[]){ if(n.texto) ED.camadas.push(novaCamada('texto',{texto:n.texto,categoria:CATS[n.categoria]?n.categoria:'chamada',nome:'Texto: '+String(n.texto).slice(0,20),cor:'#ffffff',contornoLarg:2,contornoCor:'#000000'})); }
  if(pl.trocarProduto&&ED.iaImg){ const alvo=camId(pl.trocarProduto.camadaId); const img=ED.iaImg, bg=ED.iaBg!==false;
    const r=await comCarga('Processando o novo produto...',async()=>{ let du=img.dataUrl; if(bg){ $('#ldMsg').textContent='Removendo o fundo do produto...'; du=await removerFundo(du); } $('#ldMsg').textContent='Salvando no Google Drive...'; return {id:await enviarImagemCamada(du,img.nome||'produto')}; });
    if(r) await colocarImagem(alvo,r.id,ED.imgs[r.id]); ED.iaImg=null; }
  ED.plano=null; ED.cmd=''; await garantirFontes(); atualizarTudo(); toast('Alterações aplicadas. Confira a prévia antes de aprovar.','ok');
}

/* ---- IA: edição visual generativa ---- */
function painelVisual(p){
  p.innerHTML=`<div class="pn"><div class="stbox ina">Use para mudanças visuais que não são texto/preço: <b>fundo, ambientação, iluminação, integração do produto</b>. A IA gera uma <b>prévia separada</b> — nada substitui a arte atual sem sua aprovação.</div>
  <div class="stbox warn">A IA visual pode mexer levemente em detalhes. Para trocar preços e textos, prefira a aba <b>Editar</b>, que é 100% precisa.</div>
  ${S.cfg.iaConfigurada?'':`<div class="stbox warn">Configure a chave da IA em Integração para usar este recurso.</div>`}
  <label class="f">O que a IA deve mudar?</label><textarea class="inp" id="ivTxt" rows="4" placeholder="Ex.: Mude o fundo para uma versão mais elegante em tons de rosa, preservando toda a estrutura.">${esc(ED.ivTxt||'')}</textarea>
  <label class="f">Imagem de referência (opcional)</label><div class="toolbar" style="margin:0"><button class="btn sm" id="ivRB">${ic('upl',14)} ${ED.ivRef?'Trocar':'Anexar referência'}</button>${ED.ivRef?`<img src="${ED.ivRef.dataUrl}" style="height:40px;border-radius:6px"><button class="btn ghost sm" id="ivRX">${ic('x',14)}</button>`:''}<input type="file" id="ivRF" accept="image/png,image/jpeg,image/webp" hidden></div>
  <button class="btn pri" id="ivGo" style="width:100%;margin-top:14px" ${S.cfg.iaConfigurada?'':'disabled'}>${ic('spark',15)} Gerar prévia com IA</button>
  <p class="hint">A prévia é feita sobre a arte <b>como está agora</b> (com as edições aplicadas).</p></div>`;
  $('#ivTxt',p).oninput=e=>ED.ivTxt=e.target.value;
  $('#ivRB',p).onclick=()=>$('#ivRF',p).click();
  $('#ivRF',p).onchange=async e=>{ const f=e.target.files[0]; if(!f) return; ED.ivRef=await prepararImagem(f,1600); painelVisual(p); };
  const x=$('#ivRX',p); if(x) x.onclick=()=>{ ED.ivRef=null; painelVisual(p); };
  $('#ivGo',p).onclick=gerarIA;
}
async function gerarIA(){
  const ins=(ED.ivTxt||'').trim(); if(!ins) return toast('Descreva a alteração desejada.','err');
  const cv=renderLimpo(2048); const atual=cv.toDataURL('image/jpeg',0.92);
  const r=await comCarga('A IA está gerando a prévia (pode levar até 1 minuto)...',()=>api('ia.gerar',{base64:atual.split(',')[1],mime:'image/jpeg',instrucao:ins,refBase64:ED.ivRef?ED.ivRef.b64:'',refMime:ED.ivRef?ED.ivRef.mime:''}));
  if(!r) return; const du='data:'+r.mime+';base64,'+r.base64; const img=await carregarImg(du); guardarImg(r.arquivoId,img);
  compararModal({titulo:'Prévia da edição visual por IA',a:atual,b:du,la:'Arte atual',lb:'Prévia gerada pela IA',alteracoes:['Edição visual: '+ins],
    botoes:`<button class="btn" data-b="desc">Descartar</button><button class="btn" data-b="novo">Gerar outra</button><button class="btn pri" data-b="usar">${ic('check',14)} Usar como nova versão</button>`,
    onBotao:async(b,m)=>{ m.fechar(true); if(b==='novo') return gerarIA(); if(b==='usar') criarVersaoIA(r,img,ins); }});
}
async function criarVersaoIA(r,img,ins){
  if(ED.dirty&&await confirmar('Salvar a edição atual como rascunho antes de criar a versão da IA?',{ok:'Salvar rascunho'})) { const ok=await salvarVersao('rascunho'); if(!ok) return; }
  const v={id:null,arteId:ED.arte.id,nome:'IA — '+ins.slice(0,40),tipo:'ia',baseArquivoId:r.arquivoId,renderArquivoId:r.arquivoId,paiId:ED.versao.id||ED.versao.paiId||'',status:'rascunho',alteracoes:'Edição visual por IA: '+ins,largura:img.naturalWidth,altura:img.naturalHeight};
  const s=await comCarga('Salvando nova versão...',()=>api('versoes.salvar',{versao:v,camadas:[]})); if(!s) return;
  upsertLista(S.versoes,s.versao); const arteId=ED.arte.id; await fecharEditor(true); toast('Nova versão criada a partir da IA. Revise e aprove.','ok'); abrirEditor({arteId,versaoId:s.versao.id,continuar:true});
}

/* ---- prévia, comparação, salvar ---- */
function listarAlteracoes(ini,atual){
  const out=[], mi=new Map(ini.map(c=>[c.id,c])), ma=new Map(atual.map(c=>[c.id,c]));
  for(const c of atual){ if(c.tipo==='regiao') continue; const o=mi.get(c.id), n=rotCamada(c);
    if(!o){ if(c.ativo!==false&&c.visivel!==false) out.push(`Adicionado ${TIPOS[c.tipo].toLowerCase()}: ${c.tipo==='texto'?'"'+c.texto+'"':c.tipo==='preco'?(c.precoPrefixo+' '+c.precoValor):n}`); continue; }
    const at=c.ativo!==false&&c.visivel!==false, an=o.ativo!==false&&o.visivel!==false;
    if(!at&&an){ out.push(`Restaurado ao original: ${n}`); continue; } if(!at) continue;
    if(c.tipo==='texto'&&(c.texto!==o.texto||!an)) out.push(`Texto "${CATS[c.categoria]||n}": "${o.texto}" → "${c.texto}"`);
    if(c.tipo==='preco'&&(c.precoValor!==o.precoValor||!an)) out.push(`Preço "${CATS[c.categoria]||n}": ${o.precoValor||'—'} → ${c.precoPrefixo} ${c.precoValor}`);
    if(c.tipo==='imagem'&&c.imagemId!==o.imagemId) out.push(`Produto/imagem substituído: ${n}`);
    const est=['cor','fonte','peso','contornoCor','contornoLarg','fundoCor','preenchCor','sombraDesfoque','brilho','contraste','saturacao','italico','maiusculas','riscado'].filter(k=>c[k]!==o[k]);
    if(est.length&&an) out.push(`Estilo ajustado: ${n}`);
    if(an&&['x','y','w','h','rot'].some(k=>Math.abs((c[k]||0)-(o[k]||0))>0.5)) out.push(`Posição/tamanho ajustados: ${n}`); }
  for(const o of ini) if(!ma.has(o.id)&&o.ativo!==false&&o.tipo!=='regiao') out.push(`Removido: ${rotCamada(o)}`);
  return [...new Set(out)];
}
function previa(aprovar){
  const atual=renderLimpo(1800).toDataURL('image/jpeg',0.9); const alts=listarAlteracoes(ED.ini,ED.camadas);
  const origSrc=(()=>{ const c=document.createElement('canvas'); const k=Math.min(1,1800/Math.max(ED.orig.naturalWidth,ED.orig.naturalHeight)); c.width=Math.round(ED.orig.naturalWidth*k); c.height=Math.round(ED.orig.naturalHeight*k); c.getContext('2d').drawImage(ED.orig,0,0,c.width,c.height); return c.toDataURL('image/jpeg',0.9); })();
  compararModal({titulo:aprovar?'Prévia para aprovação':'Comparar com o original',a:origSrc,b:atual,la:'Arte original',lb:'Resultado',alteracoes:alts.length?alts:['Nenhuma alteração nesta sessão.'],
    botoes:`<button class="btn" data-b="corr">Solicitar correções</button><button class="btn" data-b="rasc">${ic('save',14)} Salvar rascunho</button><button class="btn pri" data-b="aprov">${ic('check',14)} Aprovar e salvar versão final</button>`,
    onBotao:async(b,m)=>{ m.fechar(true); if(b==='corr'){ ED.aba='cmd'; painel(); toast('Descreva as correções no Comando IA ou edite os elementos diretamente.'); } if(b==='rasc') salvarVersao('rascunho'); if(b==='aprov') salvarVersao('aprovada'); }});
}
const limparCamada=c=>{ const o={...c}; delete o.versaoId; return o; };
async function salvarVersao(status){
  if(!ED) return false;
  let v={...ED.versao}; const nome=($('#eNome').value||'').trim()||v.nome;
  if(v.id&&v.status==='aprovada'){ v={...v,id:null,paiId:v.id,nome:nome===v.nome?nome+' (revisão)':nome}; toast('Versões aprovadas não são substituídas: será criada uma nova versão.'); }
  const cv=renderLimpo(); const b64=cv.toDataURL('image/png').split(',')[1];
  const alts=listarAlteracoes(ED.ini,ED.camadas);
  const r=await comCarga(status==='aprovada'?'Aprovando e salvando a versão final...':'Salvando rascunho...',()=>api('versoes.salvar',{versao:{...v,nome:v.id?nome:v.nome===ED.versao.nome?nome:v.nome,status,alteracoes:alts.join('\n'),largura:ED.W,altura:ED.H,baseArquivoId:ED.baseId},camadas:ED.camadas.map(limparCamada),renderBase64:b64,renderMime:'image/png'}));
  if(!r) return false;
  ED.versao=r.versao; upsertLista(S.versoes,r.versao); IMG.delete(r.versao.renderArquivoId); ED.dirty=false; $('#eNome').value=r.versao.nome; atualizarTopo();
  toast(status==='aprovada'?`Versão v${r.versao.numero} aprovada e salva no Drive.`:`Rascunho v${r.versao.numero} salvo.`,'ok'); return true;
}
async function salvarModelo(sem){
  if(ED.baseId!==ED.arte.arquivoId) return toast('O modelo só pode ser salvo a partir da arte original.','err');
  if(!sem&&!await confirmar('Salvar as camadas atuais como <b>modelo editável</b> desta arte?<br><span class="hint">As próximas edições começarão com estes elementos já mapeados. Alterações ativas também farão parte do modelo.</span>',{ok:'Salvar modelo'})) return;
  const mod=modeloDe(ED.arte.id);
  const r=await comCarga('Salvando modelo...',()=>api('versoes.salvar',{versao:{id:mod?mod.id:null,arteId:ED.arte.id,nome:'Modelo editável',tipo:'modelo',status:'modelo',baseArquivoId:ED.arte.arquivoId,largura:ED.W,altura:ED.H},camadas:ED.camadas.map(limparCamada)}));
  if(r){ upsertLista(S.versoes,r.versao); toast('Modelo salvo para esta arte.','ok'); }
}
